openapi: 3.1.0
info:
  title: Kun WPS Office Gateway
  version: 1.0.0-foundation
  description: |
    Trusted boundary for WPS WebOffice. Implementations keep WPS signing
    credentials server-side. Session tokens are short-lived and must not be
    persisted by clients.
servers:
  - url: https://wps-gateway.example.invalid/v1
paths:
  /documents:
    post:
      operationId: putDocument
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OfficeFormat'
        - $ref: '#/components/parameters/SourceSha256'
        - $ref: '#/components/parameters/WorkspaceIdentity'
        - $ref: '#/components/parameters/RelativePath'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        '200':
          description: Uploaded or content-addressed document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRef' }
  /documents/{documentId}/sessions:
    post:
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { enum: [read, edit] }
                locale: { type: string, maxLength: 32 }
      responses:
        '200':
          description: Short-lived WebOffice session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /documents/{documentId}/inspect:
    post:
      operationId: inspectDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { enum: [summary, text, outline, query, issues, validate] }
                target: { type: string, maxLength: 4096 }
                maxLines: { type: integer, minimum: 1, maximum: 4000 }
      responses:
        '200':
          description: Bounded structured inspection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, result]
                properties:
                  version: { $ref: '#/components/schemas/VersionRef' }
                  result: {}
  /documents/{documentId}/operations:
    post:
      operationId: applyOperations
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, operations]
              properties:
                expectedVersion: { type: string, minLength: 1, maxLength: 512 }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: object }
      responses:
        '200':
          description: New immutable remote version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionRef' }
        '409': { description: Remote version changed }
  /documents/{documentId}/render:
    post:
      operationId: renderDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                page: { type: integer, minimum: 1 }
                sheet: { type: string, maxLength: 512 }
                range: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Bounded PNG or sanitized HTML artifact
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [kind, dataBase64]
                properties:
                  kind: { enum: [image/png, text/html] }
                  dataBase64: { type: string, maxLength: 5592408 }
  /documents/{documentId}/content:
    get:
      operationId: downloadDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: version
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Exact immutable document version
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: binary }
  /documents/{documentId}:
    delete:
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: Deleted or queued for deletion }
components:
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    TenantId:
      name: X-Kun-Tenant-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    OfficeFormat:
      name: X-Kun-Office-Format
      in: header
      required: true
      schema: { enum: [doc, docx, xls, xlsx, ppt, pptx] }
    SourceSha256:
      name: X-Kun-Source-Sha256
      in: header
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    WorkspaceIdentity:
      name: X-Kun-Workspace-Identity
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    RelativePath:
      name: X-Kun-Relative-Path
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 4096 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    VersionRef:
      type: object
      additionalProperties: false
      required: [id, updatedAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 512 }
        etag: { type: string, maxLength: 512 }
        updatedAt: { type: string, format: date-time }
    DocumentRef:
      type: object
      additionalProperties: false
      required: [documentId, fileId, format, sourceSha256, version]
      properties:
        documentId: { type: string, minLength: 1, maxLength: 512 }
        fileId: { type: string, minLength: 1, maxLength: 512 }
        format: { enum: [doc, docx, xls, xlsx, ppt, pptx] }
        sourceSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        version: { $ref: '#/components/schemas/VersionRef' }
    Session:
      type: object
      additionalProperties: false
      required: [sessionId, appId, fileId, officeType, token, expiresAt, frameOrigin]
      properties:
        sessionId: { type: string, minLength: 1, maxLength: 512 }
        appId: { type: string, minLength: 1, maxLength: 512 }
        fileId: { type: string, minLength: 1, maxLength: 512 }
        officeType: { enum: [word, sheet, slide] }
        token: { type: string, minLength: 1, maxLength: 8192, readOnly: true }
        expiresAt: { type: string, format: date-time }
        frameOrigin: { type: string, format: uri }
