name: Daily Dev Prerelease

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC,对应 Asia/Shanghai 的 12:00 和次日 00:00。
    - cron: '0 4,16 * * *'

permissions:
  contents: write

concurrency:
  group: daily-dev-prerelease
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  RELEASE_CHANNEL: frontier

jobs:
  prepare:
    name: Prepare dev version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      dev_version: ${{ steps.version.outputs.dev_version }}
      head_sha: ${{ steps.version.outputs.head_sha }}
      release_name: ${{ steps.version.outputs.release_name }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Compute dev version
        id: version
        env:
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          dev_version="$(date +'%Y%m%d.%H%M')"
          app_version="0.0.0-dev-${dev_version//./-}"
          tag="dev-${dev_version}"
          release_name="Kun Dev ${dev_version}"
          head_sha="$(git rev-parse HEAD)"

          {
            echo "app_version=${app_version}"
            echo "dev_version=${dev_version}"
            echo "head_sha=${head_sha}"
            echo "release_name=${release_name}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

          echo "Dev version: ${dev_version}"
          echo "App version: ${app_version}"
          echo "Commit: ${head_sha}"

  validate:
    name: Validate dev commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Validate Extension release contracts
        run: npm run check:extensions

      - name: Test
        run: npm run test

      - name: Test bounded Kun runtime memory growth
        run: npm --prefix kun run test:memory-growth

      - name: Test joint GUI/TUI release contracts
        run: npm run test:tui-release

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 90
    needs:
      - prepare
      - validate
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      KUN_UPDATE_CHANNEL: frontier
      DEEPSEEK_GUI_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      DEEPSEEK_GUI_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      DEEPSEEK_GUI_UPDATE_CHANNEL: frontier
      RELEASE_CHANNEL: frontier
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install host-native FFmpeg
        run: |
          brew install ffmpeg-full
          ffmpeg_bin="$(brew --prefix ffmpeg-full)/bin"
          "$ffmpeg_bin/ffmpeg" -hide_banner -filters 2>&1 | grep -Eq '[[:space:]]drawtext[[:space:]]'
          echo "$ffmpeg_bin" >> "$GITHUB_PATH"
          echo "KUN_FFMPEG_PATH=$ffmpeg_bin/ffmpeg" >> "$GITHUB_ENV"
          echo "KUN_FFPROBE_PATH=$ffmpeg_bin/ffprobe" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Test Runtime data migration on native macOS
        run: npx vitest run src/main/kun-data-dir-paths.test.ts src/main/legacy-data-migration.test.ts src/main/runtime-data-dir-migration.test.ts src/main/runtime-data-dir-ownership.test.ts --reporter=dot

      - name: Test Graph Mode on native macOS
        run: npm run test:graph:platform

      - name: Build macOS packages
        run: npm run dist:mac

      - name: Smoke packaged Kun terminal command
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            resources="dist/mac-arm64/Kun.app/Contents/Resources"
          else
            resources="dist/mac/Kun.app/Contents/Resources"
          fi
          npm run smoke:packaged-cli -- \
            --resources "$resources" \
            --expected-version "${KUN_APP_VERSION}"

      - name: Verify packaged macOS x64 native architecture
        run: npm run verify:packaged-macos-native -- --resources dist/mac/Kun.app/Contents/Resources --arch x64

      - name: Verify packaged macOS arm64 native architecture
        run: npm run verify:packaged-macos-native -- --resources dist/mac-arm64/Kun.app/Contents/Resources --arch arm64

      - name: Smoke packaged OCR dependencies (macOS arm64)
        env:
          KUN_PACKAGED_RESOURCES_DIR: dist/mac-arm64/Kun.app/Contents/Resources
        run: node scripts/smoke-packaged-ocr.cjs

      - name: Smoke packaged Extension Node runtime (macOS x64)
        run: npm run smoke:packaged-extensions -- --resources dist/mac/Kun.app/Contents/Resources

      - name: Smoke packaged Extension Node runtime (macOS arm64)
        run: npm run smoke:packaged-extensions -- --resources dist/mac-arm64/Kun.app/Contents/Resources

      - name: Smoke host-native FFmpeg broker (fail closed)
        env:
          KUN_RUN_MEDIA_SMOKE: '1'
        run: npm run smoke:extension-native-media

      - name: Smoke packaged Runtime data migration
        run: npm run smoke:packaged-runtime-migration

      - name: Smoke packaged Extension desktop Chromium (host-native macOS)
        timeout-minutes: 10
        run: npm run smoke:packaged-extension-desktop

      - name: Record commit-bound macOS artifact evidence
        env:
          KUN_EVIDENCE_COMMIT: ${{ needs.prepare.outputs.head_sha }}
        run: npm run evidence:extension-native

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-dev-mac
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-*-mac-*.dmg
            dist/Kun-*-mac-*.zip
            dist/Kun-*-mac-*.blockmap
            dist/latest-mac.yml
            dist/extension-native-evidence-darwin.json

  verify-macos-x64:
    name: Verify macOS x64 prerelease artifact
    runs-on: macos-15-intel
    timeout-minutes: 30
    needs:
      - prepare
      - build-macos
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download final macOS prerelease artifacts
        uses: actions/download-artifact@v4
        with:
          name: daily-dev-mac
          path: release-artifacts

      - name: Extract final macOS x64 ZIP
        run: |
          set -euo pipefail
          archives=(release-artifacts/Kun-*-mac-x64.zip)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo "::error::Expected exactly one final macOS x64 ZIP"
            find release-artifacts -maxdepth 2 -type f -print | sort
            exit 1
          fi
          mkdir -p dist/mac-x64-verified
          ditto -x -k "${archives[0]}" dist/mac-x64-verified

      - name: Verify final macOS x64 native architecture
        run: >-
          npm run verify:packaged-macos-native --
          --resources dist/mac-x64-verified/Kun.app/Contents/Resources
          --arch x64

      - name: Smoke final macOS x64 OCR dependencies
        env:
          KUN_PACKAGED_RESOURCES_DIR: dist/mac-x64-verified/Kun.app/Contents/Resources
        run: node scripts/smoke-packaged-ocr.cjs

      - name: Smoke final macOS x64 Extension Node runtime
        run: >-
          npm run smoke:packaged-extensions --
          --resources dist/mac-x64-verified/Kun.app/Contents/Resources

      - name: Smoke final macOS x64 desktop Chromium
        timeout-minutes: 10
        run: >-
          npm run smoke:packaged-extension-desktop --
          --resources dist/mac-x64-verified/Kun.app/Contents/Resources

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 90
    needs:
      - prepare
      - validate
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      KUN_UPDATE_CHANNEL: frontier
      DEEPSEEK_GUI_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      DEEPSEEK_GUI_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      DEEPSEEK_GUI_UPDATE_CHANNEL: frontier
      RELEASE_CHANNEL: frontier
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install host-native FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          $ffmpegPath = (Get-Command ffmpeg.exe).Source
          if ((& $ffmpegPath -hide_banner -filters 2>&1 | Out-String) -notmatch '\sdrawtext\s') {
            throw 'Installed FFmpeg does not provide the required drawtext filter.'
          }
          "KUN_FFMPEG_PATH=$ffmpegPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KUN_FFPROBE_PATH=$((Get-Command ffprobe.exe).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Test Runtime data migration on native Windows
        run: npx vitest run src/main/kun-data-dir-paths.test.ts src/main/legacy-data-migration.test.ts src/main/runtime-data-dir-migration.test.ts src/main/runtime-data-dir-ownership.test.ts --reporter=dot

      - name: Test Graph Mode on native Windows
        run: npm run test:graph:platform

      - name: Build Windows installer
        run: npm run dist:win

      - name: Smoke packaged Kun terminal command
        run: >-
          npm run smoke:packaged-cli --
          --resources dist/win-unpacked/resources
          --expected-version "${env:KUN_APP_VERSION}"

      - name: Smoke packaged Extension Node runtime
        run: npm run smoke:packaged-extensions -- --resources dist/win-unpacked/resources

      - name: Smoke host-native FFmpeg broker (fail closed)
        env:
          KUN_RUN_MEDIA_SMOKE: '1'
        run: npm run smoke:extension-native-media

      - name: Smoke packaged Runtime data migration
        run: npm run smoke:packaged-runtime-migration

      - name: Smoke packaged Extension desktop Chromium
        timeout-minutes: 10
        run: npm run smoke:packaged-extension-desktop

      - name: Record commit-bound Windows artifact evidence
        env:
          KUN_EVIDENCE_COMMIT: ${{ needs.prepare.outputs.head_sha }}
        run: npm run evidence:extension-native

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-dev-win
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-*-win-x64.exe
            dist/Kun-*-win-x64.exe.blockmap
            dist/latest.yml
            dist/extension-native-evidence-win32.json

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - prepare
      - validate
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      KUN_UPDATE_CHANNEL: frontier
      DEEPSEEK_GUI_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      DEEPSEEK_GUI_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      DEEPSEEK_GUI_UPDATE_CHANNEL: frontier
      RELEASE_CHANNEL: frontier
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm fakeroot dpkg build-essential python3 xvfb xauth util-linux ffmpeg
          ffmpeg -hide_banner -filters 2>&1 | grep -Eq '[[:space:]]drawtext[[:space:]]'

      - name: Install dependencies
        run: npm ci

      - name: Test Runtime data migration on native Linux
        run: npx vitest run src/main/kun-data-dir-paths.test.ts src/main/legacy-data-migration.test.ts src/main/runtime-data-dir-migration.test.ts src/main/runtime-data-dir-ownership.test.ts --reporter=dot

      - name: Test Graph Mode on native Linux
        run: npm run test:graph:platform

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Smoke packaged Kun terminal command (linux-unpacked and deb)
        run: |
          deb_packages=(dist/Kun-*-linux-amd64.deb)
          if [[ ${#deb_packages[@]} -ne 1 || ! -f "${deb_packages[0]}" ]]; then
            echo "::error::Expected exactly one Linux deb package"
            exit 1
          fi
          npm run smoke:packaged-cli -- \
            --resources dist/linux-unpacked/resources \
            --deb "${deb_packages[0]}" \
            --expected-version "${KUN_APP_VERSION}"

      - name: Smoke packaged Extension Node runtime
        run: npm run smoke:packaged-extensions -- --resources dist/linux-unpacked/resources

      - name: Smoke host-native FFmpeg broker (fail closed)
        env:
          KUN_RUN_MEDIA_SMOKE: '1'
        run: npm run smoke:extension-native-media

      - name: Prepare and verify Linux user namespace sandbox
        run: |
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user /bin/true

      - name: Smoke packaged Runtime data migration
        run: npm run smoke:packaged-runtime-migration

      - name: Smoke packaged Extension desktop Chromium
        timeout-minutes: 10
        run: npm run smoke:packaged-extension-desktop

      - name: Smoke final Linux AppImage desktop Chromium
        timeout-minutes: 10
        run: npm run smoke:packaged-extension-appimage

      - name: Record commit-bound Linux artifact evidence
        env:
          KUN_EVIDENCE_COMMIT: ${{ needs.prepare.outputs.head_sha }}
        run: npm run evidence:extension-native

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-dev-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-*-linux-x86_64.AppImage
            dist/Kun-*-linux-x86_64.AppImage.blockmap
            dist/Kun-*-linux-amd64.deb
            dist/latest-linux.yml
            dist/extension-native-evidence-linux.json

  build-tui:
    name: Build standalone TUI prerelease (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs:
      - prepare
      - validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-22.04
            target: linux-x64
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
      KUN_UPDATE_CHANNEL: frontier
      RELEASE_CHANNEL: frontier
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_RELEASE_PREFIX: ${{ secrets.R2_RELEASE_PREFIX }}
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up packaged Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix kun ci

      - name: Test joint GUI/TUI release contracts
        run: npm run test:tui-release

      - name: Build shared Kun runtime
        run: npm run build:kun

      - name: Package standalone TUI prerelease
        run: >-
          npm run package:tui --
          --version "${{ needs.prepare.outputs.app_version }}"
          --artifact-version "${{ needs.prepare.outputs.dev_version }}"
          --tag "${{ needs.prepare.outputs.tag }}"
          --channel frontier
          --commit "${{ needs.prepare.outputs.head_sha }}"
          --target "${{ matrix.target }}"
          --output dist

      - name: Smoke standalone TUI prerelease
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(dist/Kun-TUI-*)
          archive=""
          for candidate in "${artifacts[@]}"; do
            case "$candidate" in
              *.tar.gz|*.zip) archive="$candidate" ;;
            esac
          done
          if [[ -z "$archive" ]]; then
            echo "::error::Standalone TUI archive was not produced"
            exit 1
          fi
          npm run smoke:standalone-tui -- \
            --artifact "$archive" \
            --version "${{ needs.prepare.outputs.app_version }}" \
            --target "${{ matrix.target }}"

      - name: Upload standalone TUI prerelease artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-dev-tui-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-TUI-*.tar.gz
            dist/Kun-TUI-*.zip
            dist/Kun-TUI-*.sha256
            dist/Kun-TUI-*.json

  publish:
    name: Publish prerelease
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-macos
      - verify-macos-x64
      - build-windows
      - build-linux
      - build-tui
    env:
      GH_TOKEN: ${{ github.token }}
      DEV_VERSION: ${{ needs.prepare.outputs.dev_version }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
      RELEASE_CHANNEL: frontier
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_RELEASE_PREFIX: ${{ secrets.R2_RELEASE_PREFIX }}
    steps:
      - name: Check out develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download daily dev artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: daily-dev-*
          path: release-artifacts
          merge-multiple: true

      - name: Rebuild shared GUI/TUI runtime identity
        env:
          KUN_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_version }}
          KUN_UPDATE_CHANNEL: frontier
        run: npm run build:kun

      - name: Verify daily dev artifacts
        run: |
          set -euo pipefail
          required=(
            "Kun-${DEV_VERSION}-mac-arm64.dmg"
            "Kun-${DEV_VERSION}-mac-x64.dmg"
            "Kun-${DEV_VERSION}-mac-arm64.zip"
            "Kun-${DEV_VERSION}-mac-x64.zip"
            "Kun-${DEV_VERSION}-win-x64.exe"
            "Kun-${DEV_VERSION}-linux-x86_64.AppImage"
            "Kun-${DEV_VERSION}-linux-amd64.deb"
            "latest-mac.yml"
            "latest.yml"
            "latest-linux.yml"
            "extension-native-evidence-darwin.json"
            "extension-native-evidence-win32.json"
            "extension-native-evidence-linux.json"
            "Kun-TUI-${DEV_VERSION}-mac-arm64.tar.gz"
            "Kun-TUI-${DEV_VERSION}-mac-x64.tar.gz"
            "Kun-TUI-${DEV_VERSION}-win-x64.zip"
            "Kun-TUI-${DEV_VERSION}-linux-x64.tar.gz"
          )

          for file in "${required[@]}"; do
            if [[ ! -f "release-artifacts/${file}" ]]; then
              echo "::error::Missing release artifact ${file}"
              find release-artifacts -maxdepth 2 -type f -print | sort
              exit 1
            fi
          done

          find release-artifacts -maxdepth 2 -type f -print | sort

      - name: Assemble standalone TUI prerelease contract
        run: >-
          npm run assemble:tui-release --
          --directory release-artifacts
          --version "${APP_VERSION}"
          --artifact-version "${DEV_VERSION}"
          --tag "${TAG_NAME}"
          --channel "${RELEASE_CHANNEL}"
          --commit "${HEAD_SHA}"
          --expected-build-id "$(node -p "require('./kun/dist/runtime-build.json').buildId")"
          --public-base-url "${R2_PUBLIC_BASE_URL}"
          --release-prefix "${R2_RELEASE_PREFIX:-deepseek-gui}"

      - name: Generate prerelease notes
        run: |
          set -euo pipefail
          short_sha="${HEAD_SHA::7}"
          cat > release-notes.md <<EOF
          Daily dev prerelease built from develop.

          ### Build information

          - Dev version: \`${DEV_VERSION}\`
          - App version: \`0.0.0-dev-${DEV_VERSION//./-}\`
          - Branch: \`develop\`
          - Commit: \`${short_sha}\`
          - Platforms: macOS arm64/x64, Windows x64, Linux x64 AppImage/deb
          - Standalone TUI: macOS arm64/x64, Windows x64, Linux x64
          EOF

      - name: Ensure prerelease tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" > /dev/null; then
            tag_sha="$(git rev-list -n 1 "${TAG_NAME}")"
            if [[ "${tag_sha}" != "${HEAD_SHA}" ]]; then
              echo "::error::Tag ${TAG_NAME} points at ${tag_sha}, expected ${HEAD_SHA}"
              exit 1
            fi
            echo "Reusing existing tag ${TAG_NAME}"
          else
            git tag -a "${TAG_NAME}" -m "${RELEASE_NAME}" "${HEAD_SHA}"
            git push origin "refs/tags/${TAG_NAME}"
          fi

      - name: Verify three-platform native evidence bundle
        run: >
          npm run verify:extension-native-evidence --
          --directory release-artifacts
          --commit "${HEAD_SHA}"
          --tag "${TAG_NAME}"
          --version "${DEV_VERSION}"

      - name: Create or update draft GitHub prerelease
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --draft \
              --prerelease
          else
            gh release create "${TAG_NAME}" \
              --draft \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --verify-tag \
              --prerelease
          fi

      - name: Upload GitHub prerelease assets
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-artifacts -type f \
              \( -name 'Kun-*' -o -name 'latest*.yml' -o -name 'extension-native-evidence-*.json' -o -name 'release-tui.json' -o -name 'SHA256SUMS-tui.txt' \) \
              -print0
          )

          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No release assets found"
            exit 1
          fi

          gh release upload "${TAG_NAME}" "${assets[@]}" --clobber

      - name: Upload unified prerelease archive to R2
        run: |
          set -euo pipefail
          node ./scripts/publish-r2.mjs upload --platform mac --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"
          node ./scripts/publish-r2.mjs upload --platform win --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"
          node ./scripts/publish-r2.mjs upload --platform linux --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"
          node ./scripts/publish-r2.mjs upload-tui --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"

      - name: Promote unified prerelease on R2
        run: >-
          node ./scripts/publish-r2.mjs promote
          --tag "${TAG_NAME}"
          --channel "${RELEASE_CHANNEL}"
          --platforms mac,win,linux
          --require-tui

      - name: Publish GitHub prerelease
        run: gh release edit "${TAG_NAME}" --draft=false --prerelease --latest=false
