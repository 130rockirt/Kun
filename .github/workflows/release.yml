name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  RELEASE_CHANNEL: stable

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_name: ${{ steps.version.outputs.release_name }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      existing_tag: ${{ steps.version.outputs.existing_tag }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compute release version
        id: version
        run: node ./scripts/compute-ci-release-version.cjs

  validate:
    name: Validate release commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Kun runtime dependencies
        run: npm --prefix kun ci

      - name: Typecheck root app
        run: npm run typecheck

      - name: Typecheck Kun runtime
        run: npm --prefix kun run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Validate Extension release contracts
        run: npm run check:extensions

      - name: Test root app
        run: npm run test

      - name: Test Kun runtime
        run: npm --prefix kun run test

      - name: Test joint GUI/TUI release contracts
        run: npm run test:tui-release

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 90
    needs:
      - prepare
      - validate
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.version }}
      KUN_UPDATE_CHANNEL: stable
      DEEPSEEK_GUI_APP_VERSION: ${{ needs.prepare.outputs.version }}
      DEEPSEEK_GUI_UPDATE_CHANNEL: stable
      RELEASE_CHANNEL: stable
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install host-native FFmpeg and Whisper build tooling
        run: |
          brew install cmake ffmpeg-full
          ffmpeg_bin="$(brew --prefix ffmpeg-full)/bin"
          "$ffmpeg_bin/ffmpeg" -hide_banner -filters 2>&1 | grep -Eq '[[:space:]]drawtext[[:space:]]'
          echo "$ffmpeg_bin" >> "$GITHUB_PATH"
          echo "KUN_FFMPEG_PATH=$ffmpeg_bin/ffmpeg" >> "$GITHUB_ENV"
          echo "KUN_FFPROBE_PATH=$ffmpeg_bin/ffprobe" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Test Runtime data migration on native macOS
        run: npx vitest run src/main/kun-data-dir-paths.test.ts src/main/legacy-data-migration.test.ts src/main/runtime-data-dir-migration.test.ts src/main/runtime-data-dir-ownership.test.ts --reporter=dot

      - name: Test Graph Mode on native macOS
        run: npm run test:graph:platform

      - name: Check Extension public release gate
        run: npm run check:extension-release-gate

      - name: Decode Apple signing credentials
        env:
          MAC_CODESIGN_P12_BASE64: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          for name in MAC_CODESIGN_P12_BASE64 CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret or environment value: ${name}"
              exit 1
            fi
          done

          cert_path="${RUNNER_TEMP}/developer-id.p12"
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          export CERT_PATH="${cert_path}"
          export KEY_PATH="${key_path}"

          node <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync(process.env.CERT_PATH, Buffer.from(process.env.MAC_CODESIGN_P12_BASE64, 'base64'))
          fs.writeFileSync(process.env.KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'))
          NODE

          {
            echo "CSC_LINK=${cert_path}"
            echo "APPLE_API_KEY=${key_path}"
            echo "MAC_SIGN=1"
          } >> "${GITHUB_ENV}"

      - name: Verify Apple signing credentials
        run: >
          npm run verify:apple -- --p12 "${CSC_LINK}"
          --p12-password "${CSC_KEY_PASSWORD}"
          --p8 "${APPLE_API_KEY}"
          --key-id "${APPLE_API_KEY_ID}"
          --issuer "${APPLE_API_ISSUER}"
          --check-notary

      - name: Build signed macOS packages
        run: npm run dist:mac:signed

      - name: Smoke packaged Kun terminal command
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            resources="dist/mac-arm64/Kun.app/Contents/Resources"
          else
            resources="dist/mac/Kun.app/Contents/Resources"
          fi
          npm run smoke:packaged-cli -- \
            --resources "$resources" \
            --expected-version "${KUN_APP_VERSION}"

      - name: Verify packaged macOS x64 native architecture
        run: npm run verify:packaged-macos-native -- --resources dist/mac/Kun.app/Contents/Resources --arch x64

      - name: Verify packaged macOS arm64 native architecture
        run: npm run verify:packaged-macos-native -- --resources dist/mac-arm64/Kun.app/Contents/Resources --arch arm64

      - name: Smoke packaged OCR dependencies (macOS arm64)
        env:
          KUN_PACKAGED_RESOURCES_DIR: dist/mac-arm64/Kun.app/Contents/Resources
        run: node scripts/smoke-packaged-ocr.cjs

      - name: Smoke packaged Extension Node runtime (macOS x64)
        run: npm run smoke:packaged-extensions -- --resources dist/mac/Kun.app/Contents/Resources

      - name: Smoke packaged Extension Node runtime (macOS arm64)
        run: npm run smoke:packaged-extensions -- --resources dist/mac-arm64/Kun.app/Contents/Resources

      - name: Smoke host-native FFmpeg broker (fail closed)
        env:
          KUN_RUN_MEDIA_SMOKE: '1'
        run: npm run smoke:extension-native-media

      - name: Smoke packaged Runtime data migration
        run: npm run smoke:packaged-runtime-migration

      - name: Smoke packaged Extension desktop Chromium (host-native macOS)
        timeout-minutes: 10
        run: npm run smoke:packaged-extension-desktop

      - name: Record commit-bound macOS artifact evidence
        env:
          KUN_EVIDENCE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: npm run evidence:extension-native

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-*-mac-*.dmg
            dist/Kun-*-mac-*.zip
            dist/Kun-*-mac-*.blockmap
            dist/latest-mac.yml
            dist/extension-native-evidence-darwin.json

  verify-macos-x64:
    name: Verify macOS x64 release artifact
    runs-on: macos-15-intel
    timeout-minutes: 30
    needs:
      - prepare
      - build-macos
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download final macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release-artifacts

      - name: Extract final macOS x64 ZIP
        run: |
          set -euo pipefail
          archives=(release-artifacts/Kun-*-mac-x64.zip)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo "::error::Expected exactly one final macOS x64 ZIP"
            find release-artifacts -maxdepth 2 -type f -print | sort
            exit 1
          fi
          mkdir -p dist/mac-x64-verified
          ditto -x -k "${archives[0]}" dist/mac-x64-verified

      - name: Verify final macOS x64 native architecture
        run: >-
          npm run verify:packaged-macos-native --
          --resources dist/mac-x64-verified/Kun.app/Contents/Resources
          --arch x64

      - name: Smoke final macOS x64 OCR dependencies
        env:
          KUN_PACKAGED_RESOURCES_DIR: dist/mac-x64-verified/Kun.app/Contents/Resources
        run: node scripts/smoke-packaged-ocr.cjs

      - name: Smoke final macOS x64 Extension Node runtime
        run: >-
          npm run smoke:packaged-extensions --
          --resources dist/mac-x64-verified/Kun.app/Contents/Resources

      - name: Smoke final macOS x64 desktop Chromium
        timeout-minutes: 10
        run: >-
          npm run smoke:packaged-extension-desktop --
          --resources dist/mac-x64-verified/Kun.app/Contents/Resources

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 90
    needs:
      - prepare
      - validate
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.version }}
      KUN_UPDATE_CHANNEL: stable
      DEEPSEEK_GUI_APP_VERSION: ${{ needs.prepare.outputs.version }}
      DEEPSEEK_GUI_UPDATE_CHANNEL: stable
      RELEASE_CHANNEL: stable
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install host-native FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          $ffmpegPath = (Get-Command ffmpeg.exe).Source
          if ((& $ffmpegPath -hide_banner -filters 2>&1 | Out-String) -notmatch '\sdrawtext\s') {
            throw 'Installed FFmpeg does not provide the required drawtext filter.'
          }
          "KUN_FFMPEG_PATH=$ffmpegPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KUN_FFPROBE_PATH=$((Get-Command ffprobe.exe).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Test Runtime data migration on native Windows
        run: npx vitest run src/main/kun-data-dir-paths.test.ts src/main/legacy-data-migration.test.ts src/main/runtime-data-dir-migration.test.ts src/main/runtime-data-dir-ownership.test.ts --reporter=dot

      - name: Test Graph Mode on native Windows
        run: npm run test:graph:platform

      - name: Check Extension public release gate
        run: npm run check:extension-release-gate

      - name: Build Windows installer
        run: npm run dist:win

      - name: Smoke packaged Kun terminal command
        run: >-
          npm run smoke:packaged-cli --
          --resources dist/win-unpacked/resources
          --expected-version "${env:KUN_APP_VERSION}"

      - name: Smoke packaged Extension Node runtime
        run: npm run smoke:packaged-extensions -- --resources dist/win-unpacked/resources

      - name: Smoke host-native FFmpeg broker (fail closed)
        env:
          KUN_RUN_MEDIA_SMOKE: '1'
        run: npm run smoke:extension-native-media

      - name: Smoke packaged Runtime data migration
        run: npm run smoke:packaged-runtime-migration

      - name: Smoke packaged Extension desktop Chromium
        timeout-minutes: 10
        run: npm run smoke:packaged-extension-desktop

      - name: Record commit-bound Windows artifact evidence
        env:
          KUN_EVIDENCE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: npm run evidence:extension-native

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-*-win-x64.exe
            dist/Kun-*-win-x64.exe.blockmap
            dist/latest.yml
            dist/extension-native-evidence-win32.json

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - prepare
      - validate
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.version }}
      KUN_UPDATE_CHANNEL: stable
      DEEPSEEK_GUI_APP_VERSION: ${{ needs.prepare.outputs.version }}
      DEEPSEEK_GUI_UPDATE_CHANNEL: stable
      RELEASE_CHANNEL: stable
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          # build-essential + python3: node-pty ships no Linux prebuild, so it
          # must be compiled from source against Electron's ABI during dist.
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm fakeroot dpkg build-essential python3 xvfb xauth util-linux ffmpeg
          ffmpeg -hide_banner -filters 2>&1 | grep -Eq '[[:space:]]drawtext[[:space:]]'

      - name: Install dependencies
        run: npm ci

      - name: Test Runtime data migration on native Linux
        run: npx vitest run src/main/kun-data-dir-paths.test.ts src/main/legacy-data-migration.test.ts src/main/runtime-data-dir-migration.test.ts src/main/runtime-data-dir-ownership.test.ts --reporter=dot

      - name: Test Graph Mode on native Linux
        run: npm run test:graph:platform

      - name: Check Extension public release gate
        run: npm run check:extension-release-gate

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Smoke packaged Kun terminal command (linux-unpacked and deb)
        run: |
          deb_packages=(dist/Kun-*-linux-amd64.deb)
          if [[ ${#deb_packages[@]} -ne 1 || ! -f "${deb_packages[0]}" ]]; then
            echo "::error::Expected exactly one Linux deb package"
            exit 1
          fi
          npm run smoke:packaged-cli -- \
            --resources dist/linux-unpacked/resources \
            --deb "${deb_packages[0]}" \
            --expected-version "${KUN_APP_VERSION}"

      - name: Smoke packaged Extension Node runtime
        run: npm run smoke:packaged-extensions -- --resources dist/linux-unpacked/resources

      - name: Smoke host-native FFmpeg broker (fail closed)
        env:
          KUN_RUN_MEDIA_SMOKE: '1'
        run: npm run smoke:extension-native-media

      - name: Prepare and verify Linux user namespace sandbox
        run: |
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user /bin/true

      - name: Smoke packaged Runtime data migration
        run: npm run smoke:packaged-runtime-migration

      - name: Smoke packaged Extension desktop Chromium
        timeout-minutes: 10
        run: npm run smoke:packaged-extension-desktop

      - name: Smoke final Linux AppImage desktop Chromium
        timeout-minutes: 10
        run: npm run smoke:packaged-extension-appimage

      - name: Record commit-bound Linux artifact evidence
        env:
          KUN_EVIDENCE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: npm run evidence:extension-native

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-*-linux-x86_64.AppImage
            dist/Kun-*-linux-x86_64.AppImage.blockmap
            dist/Kun-*-linux-amd64.deb
            dist/latest-linux.yml
            dist/extension-native-evidence-linux.json

  build-tui:
    name: Build standalone TUI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs:
      - prepare
      - validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-22.04
            target: linux-x64
    env:
      KUN_APP_VERSION: ${{ needs.prepare.outputs.version }}
      KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.version }}
      KUN_UPDATE_CHANNEL: stable
      RELEASE_CHANNEL: stable
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_RELEASE_PREFIX: ${{ secrets.R2_RELEASE_PREFIX }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up packaged Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix kun ci

      - name: Test joint GUI/TUI release contracts
        run: npm run test:tui-release

      - name: Build shared Kun runtime
        run: npm run build:kun

      - name: Package standalone TUI
        run: >-
          npm run package:tui --
          --version "${{ needs.prepare.outputs.version }}"
          --artifact-version "${{ needs.prepare.outputs.version }}"
          --tag "${{ needs.prepare.outputs.tag }}"
          --channel stable
          --commit "${{ github.event.pull_request.merge_commit_sha }}"
          --target "${{ matrix.target }}"
          --output dist

      - name: Smoke standalone TUI
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(dist/Kun-TUI-*)
          archive=""
          for candidate in "${artifacts[@]}"; do
            case "$candidate" in
              *.tar.gz|*.zip) archive="$candidate" ;;
            esac
          done
          if [[ -z "$archive" ]]; then
            echo "::error::Standalone TUI archive was not produced"
            exit 1
          fi
          npm run smoke:standalone-tui -- \
            --artifact "$archive" \
            --version "${{ needs.prepare.outputs.version }}" \
            --target "${{ matrix.target }}"

      - name: Upload standalone TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tui-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Kun-TUI-*.tar.gz
            dist/Kun-TUI-*.zip
            dist/Kun-TUI-*.sha256
            dist/Kun-TUI-*.json

  publish:
    name: Publish GitHub Release and R2
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-macos
      - verify-macos-x64
      - build-windows
      - build-linux
      - build-tui
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      RELEASE_CHANNEL: stable
      KUN_UPDATE_CHANNEL: stable
      DEEPSEEK_GUI_UPDATE_CHANNEL: stable
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_RELEASE_PREFIX: ${{ secrets.R2_RELEASE_PREFIX }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Rebuild shared GUI/TUI runtime identity
        env:
          KUN_APP_VERSION: ${{ needs.prepare.outputs.version }}
          KUN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.version }}
          KUN_UPDATE_CHANNEL: stable
        run: npm run build:kun

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          required=(
            "Kun-*-mac-arm64.dmg"
            "Kun-*-mac-x64.dmg"
            "Kun-*-mac-arm64.zip"
            "Kun-*-mac-x64.zip"
            "Kun-*-win-x64.exe"
            "Kun-*-linux-x86_64.AppImage"
            "Kun-*-linux-amd64.deb"
            "latest-mac.yml"
            "latest.yml"
            "latest-linux.yml"
            "extension-native-evidence-darwin.json"
            "extension-native-evidence-win32.json"
            "extension-native-evidence-linux.json"
            "Kun-TUI-${RELEASE_VERSION}-mac-arm64.tar.gz"
            "Kun-TUI-${RELEASE_VERSION}-mac-x64.tar.gz"
            "Kun-TUI-${RELEASE_VERSION}-win-x64.zip"
            "Kun-TUI-${RELEASE_VERSION}-linux-x64.tar.gz"
          )

          for pattern in "${required[@]}"; do
            if ! compgen -G "release-artifacts/${pattern}" > /dev/null; then
              echo "::error::Missing release artifact matching ${pattern}"
              find release-artifacts -maxdepth 2 -type f -print | sort
              exit 1
            fi
          done

          find release-artifacts -maxdepth 2 -type f -print | sort

      - name: Assemble standalone TUI release contract
        run: >-
          npm run assemble:tui-release --
          --directory release-artifacts
          --version "${RELEASE_VERSION}"
          --artifact-version "${RELEASE_VERSION}"
          --tag "${TAG_NAME}"
          --channel "${RELEASE_CHANNEL}"
          --commit "$(git rev-parse HEAD)"
          --expected-build-id "$(node -p "require('./kun/dist/runtime-build.json').buildId")"
          --public-base-url "${R2_PUBLIC_BASE_URL}"
          --release-prefix "${R2_RELEASE_PREFIX:-deepseek-gui}"

      - name: Generate release notes
        run: |
          set -euo pipefail
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            node ./scripts/generate-release-notes.cjs "${PREVIOUS_TAG}" > release-notes.md
          else
            node ./scripts/generate-release-notes.cjs > release-notes.md
          fi

          {
            echo
            echo "---"
            echo
            echo "### 构建信息"
            echo
            echo "- Release version: \`${RELEASE_VERSION}\`"
            echo "- Release channel: \`${RELEASE_CHANNEL}\`"
            echo "- Branch: \`master\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- macOS: Developer ID signed and notarized"
            echo "- Platforms: macOS arm64/x64, Windows x64, Linux x64 AppImage/deb"
            echo "- Standalone TUI: macOS arm64/x64, Windows x64, Linux x64"
          } >> release-notes.md

      - name: Ensure release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          head_sha="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" > /dev/null; then
            tag_sha="$(git rev-list -n 1 "${TAG_NAME}")"
            if [[ "${tag_sha}" != "${head_sha}" ]]; then
              echo "::error::Tag ${TAG_NAME} points at ${tag_sha}, expected ${head_sha}"
              exit 1
            fi
            echo "Reusing existing tag ${TAG_NAME}"
          else
            git tag -a "${TAG_NAME}" -m "${RELEASE_NAME}" "${head_sha}"
            git push origin "refs/tags/${TAG_NAME}"
          fi

      - name: Verify three-platform native evidence bundle
        run: >
          npm run verify:extension-native-evidence --
          --directory release-artifacts
          --commit "$(git rev-parse HEAD)"
          --tag "${TAG_NAME}"
          --version "${RELEASE_VERSION}"

      - name: Create or update draft GitHub Release
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG_NAME}" \
              --draft \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Upload GitHub Release assets
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-artifacts -type f \
              \( -name 'Kun-*' -o -name 'latest*.yml' -o -name 'extension-native-evidence-*.json' -o -name 'release-tui.json' -o -name 'SHA256SUMS-tui.txt' \) \
              -print0
          )

          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No release assets found"
            exit 1
          fi

          gh release upload "${TAG_NAME}" "${assets[@]}" --clobber

      - name: Upload release archive to R2
        run: |
          set -euo pipefail
          node ./scripts/publish-r2.mjs upload --platform mac --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"
          node ./scripts/publish-r2.mjs upload --platform win --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"
          node ./scripts/publish-r2.mjs upload --platform linux --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"
          node ./scripts/publish-r2.mjs upload-tui --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"

      - name: Promote R2 latest
        run: >
          node ./scripts/publish-r2.mjs promote
          --tag "${TAG_NAME}"
          --channel "${RELEASE_CHANNEL}"
          --platforms mac,win,linux
          --require-tui

      - name: Publish GitHub Release
        run: gh release edit "${TAG_NAME}" --draft=false --prerelease=false --latest
