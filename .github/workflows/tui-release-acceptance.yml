name: TUI release acceptance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    name: TUI archive (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-latest, target: win32-x64 }
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kun/package-lock.json
      - run: npm ci
      - name: Package and exercise the real archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          export KUN_APP_VERSION="$version" KUN_ARTIFACT_VERSION="$version" KUN_UPDATE_CHANNEL=stable
          npm run build:kun
          npm run package:tui -- --version "$version" --artifact-version "$version" --tag "v$version" --channel stable --commit "$GITHUB_SHA" --target '${{ matrix.target }}' --output dist/tui-contract
          artifact=$(find dist/tui-contract -type f \( -name '*.tar.gz' -o -name '*.zip' \))
          npm run smoke:standalone-tui -- --artifact "$artifact" --version "$version" --target '${{ matrix.target }}'
          node scripts/test-tui-self-update-from-0.3.7.mjs --candidate "$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: tui-contract-${{ matrix.target }}
          path: dist/tui-contract/*
          if-no-files-found: error
          retention-days: 3
  assemble:
    name: Assemble real TUI release
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: tui-contract-*
          path: tui-artifacts
          merge-multiple: true
      - name: Assemble all native archives with the production release reader
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          build_id=$(node -p "require('./tui-artifacts/Kun-TUI-$version-linux-x64.tar.gz.json').buildId")
          npm run assemble:tui-release -- --directory tui-artifacts --version "$version" --artifact-version "$version" --tag "v$version" --channel stable --commit "$GITHUB_SHA" --expected-build-id "$build_id"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-tui-contract
          path: |
            tui-artifacts/release-tui.json
            tui-artifacts/SHA256SUMS-tui.txt
          if-no-files-found: error
